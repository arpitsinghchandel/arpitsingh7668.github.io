<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found — Arpit Singh's portfolio.">
  <meta name="theme-color" content="#081120">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="img/icon-64.png">
  <link rel="canonical" href="https://arpitsingh.free.nf/404.html">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">

  <title>404 — Arpit Singh</title>

  <style>
    /* ============================================================
       404 — ARPIT SINGH PORTFOLIO
       Matches the main site's "Schematic" design system:
       dark ink-blue paper, hairline grid, amber marker accents,
       cyan signal traces. All CSS + JS for this page lives here.
       ============================================================ */

    /* ---------- tokens (same values as the main stylesheet) ---------- */
    :root {
      --ink: #081120;
      --surface: #101F36;
      --surface-2: #0C1A2C;
      --paper: #ECEFF4;
      --muted: #8FA0B8;
      --signal: #FF8A4C;
      --signal-rgb: 255, 138, 76;
      --trace: #5FD9E8;
      --trace-rgb: 95, 217, 232;
      --blue-rgb: 143, 160, 184;

      --rule: rgba(var(--blue-rgb), 0.18);
      --rule-strong: rgba(var(--blue-rgb), 0.32);
      --grid-line: rgba(var(--blue-rgb), 0.05);

      --font-display: 'Syne', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --ease: cubic-bezier(.22, .61, .36, 1);
      --grid-size: 44px;
    }

    /* ---------- reset ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      background-color: var(--ink);
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: var(--grid-size) var(--grid-size);
      background-attachment: fixed;
      color: var(--paper);
      font-family: var(--font-body);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }
    ::selection { background: rgba(var(--signal-rgb), 0.35); color: var(--paper); }

    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--trace);
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* ---------- page shell ---------- */
    .page404 {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 2rem 1.25rem;
    }

    /* soft radial glow, same palette as the hero */
    .page404__glow {
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(circle at 22% 20%, rgba(var(--trace-rgb), 0.14), transparent 55%),
        radial-gradient(circle at 78% 82%, rgba(var(--signal-rgb), 0.12), transparent 55%);
      filter: blur(60px);
      z-index: 0;
      pointer-events: none;
    }

    /* a cyan scanning beam drifting down the screen, like a radar sweep */
    .page404__scan {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .page404__scan::before {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 220px;
      top: -220px;
      background: linear-gradient(180deg, transparent 0%, rgba(var(--trace-rgb), 0.09) 45%, transparent 100%);
      animation: scanMove 6s linear infinite;
    }
    @keyframes scanMove {
      to { transform: translateY(calc(100vh + 220px)); }
    }

    .page404__content {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 640px;
    }

    .page404__badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      letter-spacing: 0.06em;
      color: var(--muted);
      border: 1px solid var(--rule);
      background: rgba(16, 31, 54, 0.5);
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      margin-bottom: 2rem;
    }
    .page404__badge-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--signal);
      animation: pulseDot 1.8s infinite;
    }
    @keyframes pulseDot {
      0% { box-shadow: 0 0 0 0 rgba(var(--signal-rgb), 0.55); }
      70% { box-shadow: 0 0 0 8px rgba(var(--signal-rgb), 0); }
      100% { box-shadow: 0 0 0 0 rgba(var(--signal-rgb), 0); }
    }

    /* ---------- big 404 code ---------- */
    .page404__code {
      display: flex;
      justify-content: center;
      gap: 0.12em;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(4.5rem, 20vw, 9rem);
      line-height: 1;
      letter-spacing: -0.02em;
      margin-bottom: 0.6rem;
    }
    .page404__code .digit {
      display: inline-block;
      color: var(--trace);
      text-shadow: 0 0 26px rgba(var(--trace-rgb), 0.45), 0 0 70px rgba(var(--trace-rgb), 0.15);
    }
    .page404__code .digit.is-scrambling {
      color: var(--signal);
      text-shadow: 0 0 20px rgba(var(--signal-rgb), 0.55);
    }
    .page404__code .digit.glitch-flicker { animation: digitFlicker 0.35s steps(2) 1; }
    @keyframes digitFlicker {
      0%   { opacity: 1; transform: translate(0, 0); }
      20%  { opacity: 0.2; transform: translate(-3px, 1px); }
      40%  { opacity: 1; transform: translate(2px, -1px); }
      60%  { opacity: 0.3; transform: translate(-2px, 0); }
      100% { opacity: 1; transform: translate(0, 0); }
    }

    /* ---------- terminal-style status line ---------- */
    .page404__terminal {
      font-family: var(--font-mono);
      font-size: 0.92rem;
      color: var(--trace);
      min-height: 1.4em;
      margin-bottom: 2.2rem;
    }
    .page404__terminal::after {
      content: '';
      display: inline-block;
      width: 8px;
      height: 1em;
      margin-left: 4px;
      background: var(--trace);
      vertical-align: -2px;
      animation: blink 0.9s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .page404__title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.4rem, 4vw, 2.1rem);
      color: var(--paper);
      margin-bottom: 0.9rem;
      letter-spacing: -0.01em;
    }

    .page404__text {
      color: var(--muted);
      font-size: 0.98rem;
      max-width: 460px;
      margin: 0 auto 2.3rem;
    }

    /* ---------- CTA button (same recipe as the main site's .button) ---------- */
    .page404__button {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      background: var(--signal);
      color: #1B0E04;
      font-weight: 700;
      font-size: 0.94rem;
      padding: 0.9rem 1.9rem;
      border-radius: 999px;
      overflow: hidden;
      isolation: isolate;
      box-shadow: 0 10px 26px rgba(var(--signal-rgb), 0.28);
      transition: transform var(--ease), box-shadow var(--ease);
    }
    .page404__button::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      transform: translateX(-120%) skewX(-15deg);
      transition: transform 0.6s var(--ease);
      z-index: -1;
    }
    .page404__button:hover::before { transform: translateX(120%) skewX(-15deg); }
    .page404__button:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 14px 30px rgba(var(--signal-rgb), 0.4); }
    .page404__button:active { transform: translateY(0) scale(0.98); }

    .page404__signature {
      margin-top: 2.6rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    /* ---------- responsive ---------- */
    @media screen and (max-width: 480px) {
      .page404__code { gap: 0.08em; }
      .page404__terminal { font-size: 0.8rem; }
    }

    /* ---------- reduced motion ---------- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
      .page404__scan::before { display: none; }
    }
  </style>
</head>
<body>

  <div class="page404">
    <div class="page404__glow" aria-hidden="true"></div>
    <div class="page404__scan" aria-hidden="true"></div>

    <main class="page404__content">
      <p class="page404__badge">
        <span class="page404__badge-dot" aria-hidden="true"></span>
        SYSTEM.LOG
      </p>

      <div class="page404__code" id="code404" aria-label="404 error">
        <span class="digit">4</span><span class="digit">0</span><span class="digit">4</span>
      </div>

      <p class="page404__terminal" id="terminalLine" aria-live="polite"></p>

      <h1 class="page404__title">This route isn't on the blueprint.</h1>
      <p class="page404__text">The page you're looking for has been moved, renamed, or never existed. Let's get you back to solid ground.</p>

      <a href="index.html" class="page404__button">← Back to Home</a>

      <p class="page404__signature">— Arpit Singh</p>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      /* ---------- 404 digits: glitch-scramble reveal + idle flicker ---------- */
      const digits = Array.from(document.querySelectorAll('.page404__code .digit'));
      const GLITCH_CHARS = '01#%&*<>/\\';

      const scrambleDigit = (el, delay) => new Promise((resolve) => {
        setTimeout(() => {
          const final = el.dataset.final;
          el.classList.add('is-scrambling');
          let ticks = 0;
          const maxTicks = 8;
          const iv = setInterval(() => {
            ticks += 1;
            if (ticks >= maxTicks) {
              clearInterval(iv);
              el.textContent = final;
              el.classList.remove('is-scrambling');
              resolve();
            } else {
              el.textContent = GLITCH_CHARS[Math.floor(Math.random() * GLITCH_CHARS.length)];
            }
          }, 45);
        }, delay);
      });

      const startIdleFlicker = () => {
        setInterval(() => {
          const target = digits[Math.floor(Math.random() * digits.length)];
          target.classList.add('glitch-flicker');
          setTimeout(() => target.classList.remove('glitch-flicker'), 400);
        }, 3200);
      };

      if (digits.length) {
        digits.forEach((d) => { d.dataset.final = d.textContent; });

        if (reduceMotion) {
          // keep the plain digits, skip the scramble/flicker entirely
        } else {
          Promise.all(digits.map((d, i) => scrambleDigit(d, i * 130))).then(startIdleFlicker);
        }
      }

      /* ---------- terminal status line: typewriter ---------- */
      const terminalEl = document.getElementById('terminalLine');
      const terminalMessage = '> ERROR 404 — ROUTE_NOT_FOUND';

      if (terminalEl) {
        if (reduceMotion) {
          terminalEl.textContent = terminalMessage;
        } else {
          (async () => {
            for (const ch of terminalMessage) {
              terminalEl.textContent += ch;
              await wait(35);
            }
          })();
        }
      }

      /* ---------- magnetic hover on the home button ---------- */
      const btn = document.querySelector('.page404__button');
      if (btn) {
        btn.addEventListener('mousemove', (e) => {
          const rect = btn.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          btn.style.transform = `translate(${x * 0.18}px, ${y * 0.35}px)`;
        });
        btn.addEventListener('mouseleave', () => { btn.style.transform = ''; });
      }
    });
  </script>

</body>
</html>
